name: Generate Datas

on:
  schedule: # execute every 5 hours (at minute 0)
    - cron: "0 */5 * * *"
  workflow_dispatch:

concurrency:
  group: generate-datas
  cancel-in-progress: true

jobs:
  build:
    name: Jobs to update datas
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      # Snake Animation
      - uses: Platane/snk@master
        id: snake-gif
        with:
          github_user_name: Rayan-Aguiar
          svg_out_path: dist/github-contribution-grid-snake.svg

      - uses: crazy-max/ghaction-github-pages@v5
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
